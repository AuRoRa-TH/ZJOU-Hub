<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优秀学长案例详情 - 浙江海洋大学资料共享站</title>
  
  <!-- 图标 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>">
  
  <!-- 样式文件 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= 顶部导航 ================= -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo" title="返回首页">
        <span class="brand-icon">🌊</span>
        <span class="brand-title">浙江海洋大学资料共享站</span>
      </a>

      <div class="nav-actions">
        <a href="https://github.com/AuRoRa-TH/ZJOU-Hub" target="_blank" rel="noopener noreferrer" class="upload-nav-tip" title="前往 GitHub 仓库上传资料">
          <span>📤 上传资料点此</span>
          <span style="color: var(--ocean-primary); font-weight: bold;">➔</span>
        </a>
        <a href="https://github.com/AuRoRa-TH/ZJOU-Hub" target="_blank" rel="noopener noreferrer" class="github-link-btn" title="访问 GitHub 仓库 (AuRoRa-TH/ZJOU-Hub)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- ================= 主体内容 ================= -->
  <main class="container">
    
    <!-- 顶部面包屑导航与返回按钮 (居中对齐排版) -->
    <div class="page-top-bar">
      <a href="seniors.html" class="btn-back">← 返回案例列表</a>
      <div class="breadcrumb-row">
        <a href="index.html" class="breadcrumb-item">🏠 首页</a>
        <span class="breadcrumb-sep">/</span>
        <a href="seniors.html" class="breadcrumb-item">🌟 优秀学长案例</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current" id="breadcrumbSubjectName">案例详情</span>
      </div>
    </div>

    <!-- 案例专属高光简介卡片 (整合头部与简介.md 核心展示) -->
    <div id="seniorShowcaseContainer"></div>

    <!-- ================= 案例资料列表 ================= -->
    <div class="papers-list-header">
      <h3 class="papers-list-title">🏆 优秀案例与经验资料列表</h3>
      <span class="papers-list-count" id="papersListCount">共 0 份案例</span>
    </div>

    <section class="papers-vertical-list" id="papersVerticalList">
      <!-- 由 JS 动态渲染 -->
    </section>

  </main>

  <!-- ================= 详情下载弹窗 ================= -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-head">
        <h3 class="modal-title" id="modalTitle">案例详情与通道</h3>
        <span class="modal-close" onclick="closeModal()">✕</span>
      </div>

      <div id="modalBody">
        <!-- 动态注入 -->
      </div>
    </div>
  </div>

  <!-- ================= Toast 容器 ================= -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ================= 页脚 ================= -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-motto">海纳百川 自强不息 向海图强 开拓未来</div>
      <p>© 浙江海洋大学 (ZJOU) 学习资料共享站</p>
    </div>
  </footer>

  <!-- 数据源与渲染脚本 -->
  <script src="js/data.js"></script>
  <script>
    let currentSubject = null;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const subjectId = urlParams.get('id') || 'tongji';

      currentSubject = (SENIOR_SUBJECTS || []).find(s => s.id === subjectId) || (SENIOR_SUBJECTS || [])[0];

      if (!currentSubject) {
        document.getElementById('seniorShowcaseContainer').innerHTML = `
          <div style="text-align: center; padding: 40px; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--border-color); max-width: 960px; margin: 0 auto;">
            未找到该案例信息，<a href="seniors.html" style="color: var(--ocean-primary); font-weight: bold;">点击返回案例列表</a>
          </div>
        `;
        return;
      }

      // 更新网页标题与面包屑
      document.title = `${currentSubject.title} - 浙江海洋大学资料共享站`;
      document.getElementById('breadcrumbSubjectName').textContent = currentSubject.name;

      // 渲染学长高光简介卡片 (整合头部、战绩与简介.md)
      renderSeniorShowcase(currentSubject);

      // 渲染该分类的所有案例资料
      renderPapersList(currentSubject.papers || []);
    });

    // 渲染学长高光简介展示卡片 (简介.md)
    function renderSeniorShowcase(subject) {
      const container = document.getElementById('seniorShowcaseContainer');
      if (!container) return;

      container.innerHTML = `
        <div class="senior-profile-showcase">
          <div class="senior-profile-info">
            <div class="senior-profile-badge-row">
              <span class="senior-profile-badge">👑 浙海大榜样力量</span>
              <span class="badge-tag-sm type" style="font-weight: 700;">${escapeHtml(subject.type || '经验分享')}</span>
            </div>
            
            <h1 class="senior-profile-subject-title">${escapeHtml(subject.title)}</h1>
            <h2 class="senior-profile-headline">${escapeHtml(subject.headline || subject.title)}</h2>

            <div class="senior-profile-quote">
              <div>“${escapeHtml(subject.quote || '信院最高战力！！！！！')}”</div>
              ${subject.quoteSub ? `<div class="senior-profile-quote-sub">“${escapeHtml(subject.quoteSub)}”</div>` : ''}
            </div>

            <p class="senior-profile-md-content">${escapeHtml(subject.description)}</p>
          </div>

          ${subject.image ? `
            <div class="senior-profile-poster-wrap">
              <a href="${encodeURI(subject.image)}" target="_blank" title="点击查看高清录取海报原图">
                <img src="${encodeURI(subject.image)}" alt="${escapeHtml(subject.name)}" class="senior-profile-poster-img">
              </a>
              <a href="${encodeURI(subject.image)}" target="_blank" class="senior-profile-poster-hint">
                <span>🔍 点击查看高清大图</span>
              </a>
            </div>
          ` : ''}
        </div>
      `;
    }

    // 渲染案例资料列表
    function renderPapersList(papers) {
      document.getElementById('papersListCount').textContent = `共 ${papers.length} 份案例`;

      const listContainer = document.getElementById('papersVerticalList');
      if (papers.length === 0) {
        listContainer.innerHTML = `
          <div style="text-align: center; padding: 60px 20px; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px dashed var(--border-color); max-width: 960px; margin: 0 auto;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">📭</div>
            <p style="color: var(--text-muted); font-size: 1rem; font-weight: 600;">当前还没有相关案例作品</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = papers.map((paper, index) => {
        const primaryLink = paper.links && paper.links[0] ? paper.links[0] : {};
        const hasCode = !!primaryLink.code;
        const isPdf = (paper.fileType || '').toLowerCase() === 'pdf';
        const isHtml = (paper.fileType || '').toLowerCase() === 'html';
        const openText = isPdf ? '📄 查阅 PDF 原件' : (isHtml ? '🌐 在线打开案例网页' : '📥 下载源文件');

        return `
          <div class="paper-item-module" id="paper-${paper.id}" onclick="openSeniorDirect('${paper.id}')" title="点击直接查阅此案例作品">
            <div class="paper-item-top">
              <div class="paper-item-badges">
                <span class="paper-index-badge">第 ${index + 1} 项</span>
                <span class="badge-tag" style="background: #fef3c7; color: #b45309;">${escapeHtml(paper.tag)}</span>
                <span class="filetype-text">${paper.fileType.toUpperCase()} · ${escapeHtml(paper.fileSize)}</span>
              </div>
              <span class="paper-item-year">🏆 ${escapeHtml(paper.year)}</span>
            </div>

            <h3 class="paper-item-title">${escapeHtml(paper.title)}</h3>
            <p class="paper-item-desc">${escapeHtml(paper.description)}</p>

            <div class="paper-item-footer">
              <div class="paper-meta-info">
                <span>👤 榜样学长: ${escapeHtml(paper.contributor)}</span>
                <span>🕒 分享时间: ${escapeHtml(paper.updateTime)}</span>
              </div>
              <div class="paper-action-btns">
                ${paper.localUrl ? `
                  <a href="${encodeURI(paper.localUrl)}" target="_blank" class="btn-download" style="background: #0284c7;" onclick="event.stopPropagation();" title="直接在浏览器中打开 / 下载此文件">
                    ${openText}
                  </a>
                ` : ''}
                ${hasCode ? `
                  <button class="btn-copy-code" onclick="copyCode('${primaryLink.code}', event)">
                    🔑 提取码: ${primaryLink.code}
                  </button>
                ` : ''}
                <button class="btn-download" onclick="openPaperModal('${paper.id}', event)">
                  <span>获取通道</span> ➔
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 点击卡片直接打开或打开弹窗
    function openSeniorDirect(paperId) {
      if (!currentSubject || !currentSubject.papers) return;
      const paper = currentSubject.papers.find(p => p.id === paperId);
      if (!paper) return;

      if (paper.localUrl) {
        window.open(encodeURI(paper.localUrl), '_blank');
      } else {
        openPaperModal(paperId);
      }
    }

    // 打开下载弹窗
    function openPaperModal(paperId, event) {
      if (event) event.stopPropagation();

      if (!currentSubject || !currentSubject.papers) return;
      const paper = currentSubject.papers.find(p => p.id === paperId);
      if (!paper) return;

      document.getElementById('modalTitle').textContent = paper.title;

      let linksHtml = '';
      if (paper.links && paper.links.length > 0) {
        linksHtml = paper.links.map((link) => {
          return `
            <div class="download-link-row">
              <div class="link-info">
                <span class="link-platform">🚀 ${link.platform}</span>
                ${link.code ? `<span class="link-code-badge">提取码: <b>${link.code}</b></span>` : ''}
              </div>
              <div class="link-action-btns">
                ${link.code ? `
                  <button class="btn-copy-code" onclick="copyCode('${link.code}', event)">
                    📋 复制提取码
                  </button>
                ` : ''}
                <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="btn-direct-download">
                  ${link.isDirect ? '直达专区 ➔' : '进入网盘 ➔'}
                </a>
              </div>
            </div>
          `;
        }).join('');
      } else {
        linksHtml = '<p style="color: var(--text-muted); padding: 12px 0;">暂无可用的下载通道</p>';
      }

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-paper-desc">
          <p><b>案例简介：</b>${escapeHtml(paper.description)}</p>
          <div class="modal-meta-grid">
            <div><b>🏷️ 标签类型：</b>${escapeHtml(paper.tag)}</div>
            <div><b>🏆 案例类型：</b>${escapeHtml(paper.year)}</div>
            <div><b>👤 榜样学长：</b>${escapeHtml(paper.contributor)}</div>
            <div><b>🕒 更新日期：</b>${escapeHtml(paper.updateTime)}</div>
          </div>
        </div>

        <div class="modal-download-section">
          <h4>📥 获取与查阅通道：</h4>
          <div class="links-list-box">
            ${linksHtml}
          </div>
        </div>
      `;

      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // 点击弹窗背景遮罩关闭
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) {
        closeModal();
      }
    });

    // 复制提取码
    function copyCode(code, event) {
      if (event) event.stopPropagation();
      navigator.clipboard.writeText(code).then(() => {
        showToast(`已复制提取码: ${code}`);
      }).catch(() => {
        showToast(`提取码: ${code}`);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 2200);
    }
  </script>
</body>
</html>
